# Builds SiliconGhost for Windows, macOS and Linux, runs the unit tests on
# each, and packages it: a .zip for Windows, a .dmg for each Mac processor,
# an AppImage for Linux. A version tag (vX.Y.Z) puts them in a draft release,
# whose notes are the tag's message, and publishes it once it has all of
# them. The draft is made once the Windows and Linux downloads are built; the
# macOS ones, which can wait a while for a runner (see retry.yml), are added
# when they are ready.
# Run it by hand to rebuild an existing tag, or with a branch to build the
# downloads (kept with the run for a week) without releasing them.
name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag (or branch) to build
        required: true

permissions:
  contents: write

# One build of a tag at a time; another waits for it.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.v.outputs.name }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - id: v
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null && [ "${TAG#v}" != "$TAG" ]; then
            v="${TAG#v}"
            # The tag must match the version the program reports.
            p=$(sed -n 's/^project(SiliconGhost VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
            [ "${v%%-*}" = "$p" ] || { echo "tag $TAG does not match project version $p in CMakeLists.txt"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            v="build-$(git rev-parse --short=7 HEAD)"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-libslirp
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSG_WERROR=ON
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          d="SiliconGhost-${{ needs.version.outputs.name }}-windows-x64"
          mkdir "$d"
          cp build/siliconghost.exe README.md LICENSE "$d"/
          # The DLLs it uses from the toolchain's own folder
          ldd build/siliconghost.exe | awk '/\/ucrt64\/bin\// {print $3}' | sort -u | xargs -I{} cp {} "$d"/
          ls "$d"
          zip -r "$d.zip" "$d"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: SiliconGhost-*.zip
          retention-days: 7

  macos:
    needs: version
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Dependencies
        run: brew install sdl3 libslirp pkgconf ninja
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSG_WERROR=ON
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          cmake --install build --prefix "$PWD/dist"
          ln -s /Applications dist/Applications
          cp README.md LICENSE dist/
          hdiutil create -volname "Silicon Ghost" -srcfolder dist -ov -format UDZO \
            "SiliconGhost-${{ needs.version.outputs.name }}-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: SiliconGhost-*.dmg
          retention-days: 7

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libslirp-dev file imagemagick \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libgl-dev libgles-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev
      - name: SDL3
        # Ubuntu 24.04 has no SDL3 package; built here, the AppImage runs on
        # this release and later.
        run: |
          git clone --depth 1 --branch release-3.4.18 https://github.com/libsdl-org/SDL.git sdl
          cmake -S sdl -B sdl/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local -DSDL_TESTS=OFF
          cmake --build sdl/build
          sudo cmake --install sdl/build
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSG_WERROR=ON
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          convert graphics/SiliconGhost_icon_1024.png -resize 256x256 siliconghost.png
          cat > siliconghost.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Silicon Ghost
          Comment=SGI Indy and Indigo2 emulator
          Exec=siliconghost
          Icon=siliconghost
          Categories=System;Emulator;
          EOF
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --executable build/siliconghost \
            --desktop-file siliconghost.desktop --icon-file siliconghost.png --output appimage
          mv Silicon_Ghost-*.AppImage "SiliconGhost-${{ needs.version.outputs.name }}-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: SiliconGhost-*.AppImage
          retention-days: 7

  release:
    needs: [version, windows, linux]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - run: |
          ls -l assets
          v="${{ needs.version.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A rebuild: new files for the release, its notes kept
            gh release upload "$TAG" assets/* --clobber
          else
            git tag -l --format='%(contents:body)' "$TAG" > notes.md
            pre=""; case "$v" in *-*) pre="--prerelease";; esac
            gh release create "$TAG" assets/* --draft --verify-tag $pre \
              --title "SiliconGhost $v" --notes-file notes.md
          fi

  release-macos:
    needs: [version, macos, release]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          path: assets
          merge-multiple: true
      - run: gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish the release once every download is in
        run: |
          have=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for kind in windows-x64.zip macos-arm64.dmg macos-x86_64.dmg linux-x86_64.AppImage; do
            echo "$have" | grep -q -- "-$kind\$" || { echo "missing $kind: left as it is"; exit 1; }
          done
          # (A release published already, rebuilt by hand, is left as it is.)
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
            latest="--latest"; case "${{ needs.version.outputs.name }}" in *-*) latest="";; esac
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false $latest
          fi
